name: Test and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet -mod=readonly ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Test
        run: |
          go test -mod=readonly -race -cover ./...
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build shared library
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p dist
          version_args=()
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version_args=(-ldflags "-X main.version=${GITHUB_REF_NAME#v}")
          fi
          go build -mod=readonly -trimpath -buildmode=c-shared "${version_args[@]}" -o dist/workbuddy.so .
          cd dist
          sha256sum workbuddy.so workbuddy.h > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workbuddy-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
